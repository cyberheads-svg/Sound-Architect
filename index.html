  .counter{font-size:10px;color:var(--dim);margin-top:8px;letter-spacing:.2em}

  .divider{border:none;border-top:1px solid var(--border);margin-bottom:20px}
  .prompt-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .prompt-text{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:14px;word-break:break-word}
  .copy-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);padding:7px 18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .15s}
  .copy-btn:hover{border-color:var(--accent1);color:var(--accent1)}
  .copy-btn.copied{border-color:var(--accent3);color:var(--accent3)}
  .generate-btn{width:100%;max-width:560px;background:transparent;border:1px solid #3a2a5a;color:var(--accent1);padding:16px;font-size:11px;letter-spacing:.35em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .2s;margin-bottom:12px}
  .generate-btn:hover{background:#1a1228;border-color:var(--accent1)}
  .save-btn{width:100%;max-width:560px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:12px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .2s;margin-bottom:40px}
  .save-btn:hover{border-color:var(--border2);color:var(--text)}
  .saved-section{width:100%;max-width:560px}
  .saved-title{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .saved-item{background:var(--panel);border:1px solid var(--border);padding:14px 16px;margin-bottom:8px;font-size:11px;color:var(--muted);line-height:1.7;cursor:pointer;transition:border-color .15s}
  .saved-item:hover{border-color:var(--border2);color:var(--text)}
  footer{margin-top:20px;font-size:10px;color:var(--dim);letter-spacing:.15em;text-align:center}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .animate-in{animation:fadeIn .3s ease forwards}
</style>
</head>

const MOODS=["melancholic and cinematic","nostalgic and warm","eerie and unsettling","euphoric and transcendent","cold and detached","intimate and confessional","dreamy and hazy","urgent and tense","tender and fragile","dark and brooding","playful and irreverent","desolate and sparse","lush and romantic","hypnotic and trance-like","bittersweet and wistful","angry and cathartic","serene and meditative","mysterious and shadowy","yearning and aching","bright and hopeful","surreal and disorienting","raw and vulnerable","polished and sophisticated","primitive and ritualistic","celestial and vast","claustrophobic and dense","liberating and expansive","slow-burning and sensual","jittery and anxious","deeply melancholic","triumphant and soaring","quiet desperation","fever dream logic","autumn afternoon light","3am loneliness","sun-drenched and hazy","rain-soaked and grey","smoke and mirrors","underwater and muffled","burning and intense","glacial and patient","feverish and restless","ancient and timeless","futuristic and cold","warm analog nostalgia","coastal and salt-air","landlocked and vast","urban and nocturnal","suburban and hollow","rural and elemental","post-breakup clarity","pre-dawn stillness","mid-afternoon drift","golden hour warmth","blue hour longing","dissociative and detached","hyper-present and vivid","slow dissolve","sudden clarity","long exhale","obsessive and circling","letting go","holding on","barely holding together","quietly falling apart","strange and beautiful","ugly and honest","precise and cold","warm and imprecise","achingly human","machine-like efficiency","organic and breathing","crystalline and fragile","muddy and earthen","clean and surgical","decadent and excessive","ascetic and bare","maximalist emotion","minimalist restraint","controlled chaos","tender resignation","furious grace","slow ecstasy","quiet devastation","gentle menace","like fog at dawn","like static between stations","like driving alone at night","like an empty house","like the last song","cinematic and vast","dusty and worn","pristine and cold","overgrown and lush","stripped and bare","dense and claustrophobic","wide and open","flickering and unstable","fixed and still","spinning and lost"];

const INSTRUMENTS=["reverb-soaked guitar","upright bass","brushed drums","rhodes piano","acoustic guitar fingerpicking","lap steel guitar","12-string jangle","distorted power chords","tremolo guitar","slide guitar","prepared piano","string quartet","cello drone","violin harmonics","harpsichord","mellotron","farfisa organ","hammond organ","pump organ","grand piano","synthesizer arpeggios","analog synth bass","pad layers","vocoder texture","drum machine beat","808 sub bass","lo-fi drum loop","vinyl crackle","tape hiss","field recordings","upright bass walk","jazz guitar chord melody","vibraphone","marimba","kalimba","nylon string guitar","sitar texture","koto sample","shamisen-influenced","gamelan-inspired","brass stabs","muted trumpet","flugelhorn","trombone slide","euphonium drone","flute breath","alto saxophone","tenor sax improvisation","clarinet melody","oboe counterpoint","banjo picking","mandolin tremolo","dulcimer drone","autoharp","resonator guitar","distorted bass","fuzz guitar","clean telecaster","jazzmaster shimmer","strat through chorus","heavy reverb room","spring reverb","plate reverb","tape delay","ping-pong delay","glockenspiel","music box","toy piano","thumb piano","singing bowl","congas","bongos","cajón","hand percussion","talking drum","808 hi-hats","trap snare roll","breakbeat loop","jungle rhythm","garage beat","slow crush beat","half-time feel","waltz rhythm","bolero pattern","samba groove","sub bass pulse","sine wave bass","fretless bass","piccolo bass","bass clarinet","glass harmonica","waterphone","ebow guitar","prepared guitar","extended technique strings","choir texture","choral pad","unison strings","divisi strings","pizzicato strings"];

const SCENES=[
  "rain-soaked city at 3am","empty apartment at dawn","driving alone at night",
  "late night diner under neon lights","foggy coastline at sunrise",
  "after a quiet breakup","hotel room with dim lights",
  "crowded train but feeling alone","warm afternoon in a small kitchen",
  "rooftop overlooking the city at dusk","abandoned shopping mall at midnight",
  "last train home on a Friday","smoke-filled bar after closing time",
  "sitting in a parked car in the rain","watching the city from a hospital window",
  "slow dance in an empty room","summer night with all the windows open",
  "unpacking boxes in a new city alone","walking home after the party ends",
  "staring at the ceiling at 4am"
];

const PRODUCTION=["lo-fi cassette warmth","high fidelity studio polish","raw live recording","spatial stereo depth","analog saturation","vintage tape compression","bedroom recording intimacy","arena reverb","dry and close-miked","wet and cavernous","warm tube saturation","cold digital precision","layered overdubs","minimal single take","dense production","sparse arrangement","1960s mono feel","1970s analog warmth","1980s gated reverb","1990s lo-fi aesthetic","2000s digital sheen"];

const TEMPO=[70,75,80,85,88,90,92,95,98,100,104,108,110,112,115,118,120,124,128,132,138,145,150,160,170];

const COLORS=["#c084fc","#67e8f9","#86efac","#fda4af","#fcd34d","#a5f3fc","#d9f99d","#fed7aa","#f9a8d4"];

let generated=0,currentPrompt="";

const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const pickN=(arr,n)=>[...arr].sort(()=>0.5-Math.random()).slice(0,Math.min(n,arr.length));

function generate(){
  generated++;
  document.getElementById("counter").textContent=`${generated} generated`;

  const vocal=pick(VOCALS);
  const genre=pick(GENRES);
  const subgenreList=SUBGENRES[genre];
  const subgenre=subgenreList?pick(subgenreList):null;
  const mood=pick(MOODS);
  const insts=pickN(INSTRUMENTS,Math.random()<0.5?2:3);
  const prod=Math.random()<0.4?pick(PRODUCTION):null;
  const tempo=Math.random()<0.3?pick(TEMPO)+" BPM":null;
  const scene=Math.random()<0.35?pick(SCENES):null;

  const parts=["female vocals",vocal,genre];
  if(subgenre)parts.push(subgenre);
  parts.push(insts.join(", "),mood);
  if(prod)parts.push(prod);
  if(tempo)parts.push(tempo);
  if(scene)parts.push(scene);
  currentPrompt=parts.join(", ");

  const fields=[
    {label:"ボーカル",value:vocal,color:COLORS[0]},
    {label:"ジャンル",value:genre,color:COLORS[1]},
  ];
  if(subgenre)fields.push({label:"サブジャンル",value:subgenre,color:COLORS[8]});
  fields.push(
    {label:"楽器",value:insts.join(", "),color:COLORS[2]},
    {label:"ムード",value:mood,color:COLORS[3]}
  );
  if(prod)fields.push({label:"プロダクション",value:prod,color:COLORS[4]});
  if(tempo)fields.push({label:"テンポ",value:tempo,color:COLORS[5]});
  if(scene)fields.push({label:"シーン",value:scene,color:COLORS[6]});

  const fieldsHTML=fields.map(f=>`
    <div class="field">
      <div class="field-label">${f.label}</div>
      <div class="field-value" style="color:${f.color}">${f.value}</div>
    </div>
  `).join("");

  document.getElementById("result").innerHTML=`
    <div class="fields animate-in">${fieldsHTML}</div>
    <hr class="divider">
    <div class="prompt-label">Sunoにコピー</div>
    <div class="prompt-text">${currentPrompt}</div>
    <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
  `;

  document.getElementById("emptyState").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("saveBtn").style.display="block";
}

function copyPrompt(){
  if(!currentPrompt)return;
  navigator.clipboard.writeText(currentPrompt).then(()=>{
    const btn=document.getElementById("copyBtn");
    btn.textContent="Copied ✓";btn.classList.add("copied");
    setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("copied")},2000);
  });
}

function savePrompt(){
  if(!currentPrompt)return;
  let saved=JSON.parse(localStorage.getItem("sound_arch_v4")||"[]");
  if(saved.includes(currentPrompt))return;
  saved.unshift(currentPrompt);
  localStorage.setItem("sound_arch_v4",JSON.stringify(saved.slice(0,30)));
  renderSaved();
}

function renderSaved(){
  const saved=JSON.parse(localStorage.getItem("sound_arch_v4")||"[]");
  const section=document.getElementById("savedSection");
  const list=document.getElementById("savedList");
  if(saved.length===0){section.style.display="none";return}
  section.style.display="block";
  list.innerHTML=saved.map((p,i)=>`<div class="saved-item" data-index="${i}">${p}</div>`).join("");
  document.querySelectorAll(".saved-item").forEach(el=>{
    el.onclick=()=>navigator.clipboard.writeText(saved[el.dataset.index]);
  });
}

renderSaved();
</script>

</body>
</html>
